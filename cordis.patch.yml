# dsh-plugin-role-auditor — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "roles".
# Tools resultantes: mcp__roles__* (ver README).
- insert:
    - id: mcp-role-auditor
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: roles
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/role-auditor/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
